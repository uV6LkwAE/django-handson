{% extends "base.html" %}

{% block title %}ログイン{% endblock %}
{% block content %}
    <h1 class="mb-3">ログイン</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-primary" type="submit">ログイン</button>
    </form>
    <a href="{% url 'book:signup' %}">サインアップ</a>
{% endblock %}
