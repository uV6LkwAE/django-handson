{% extends "base.html" %}

{% block title %}本の一覧{% endblock %}
{% block content %}
    <h1 class="mb-3">本の一覧</h1>
    <a class="btn btn-primary mb-3" href="{% url 'book:book_create' %}">新規作成</a>
    <ul class="list-group">
        {% for book in books %}
            <li class="list-group-item">
                <a href="{% url 'book:book_detail' book.pk %}">{{ book.title }}</a> <span class="badge text-bg-secondary">{{ book.get_category_display }}</span>
            </li>
        {% empty %}
            <li class="list-group-item">本はまだ登録されていません。</li>
        {% endfor %}
    </ul>
{% endblock %}
