{% extends "base.html" %}

{% block title %}レビュー投稿{% endblock %}
{% block content %}
<h1 class="mb-3">「{{ book.title }}」のレビュー</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">投稿</button>
    <a class="btn btn-secondary" href="{% url 'book:book_detail' book.pk %}">戻る</a>
</form>
{% endblock %}
